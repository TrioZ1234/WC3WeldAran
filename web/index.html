<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>War for WeldAran — просмотрщик мира</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #0d0f13; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud {
        position: fixed; top: 12px; left: 12px; padding: 12px 14px;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #cbd3e1; background: rgba(14,17,22,.82);
        border: 1px solid #232a35; border-radius: 8px; pointer-events: none;
        min-width: 250px;
      }
      #hud b { color: #7fd4a0; font-weight: 600; }
      #hud .k { color: #6d7788; }
      #err {
        position: fixed; inset: 0; display: none; place-items: center;
        padding: 40px; text-align: center; color: #ffb4b4;
        font: 14px/1.7 ui-monospace, monospace; background: #0d0f13;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud">загрузка…</div>
    <div id="err"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
